name: cli
on:
  push:
    paths: ['cli/**', '.github/workflows/cli.yml']
  pull_request:
    paths: ['cli/**']
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix cli test
        env:
          JINSIL_NO_BROWSER: '1'
